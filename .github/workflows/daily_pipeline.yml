name: Daily Pipeline

on:
  schedule:
    - cron: "30 18 * * *"  # Runs at 12:00 AM IST daily (6:30 PM UTC previous day)
  workflow_dispatch:      # Allows you to manually trigger from GitHub UI

permissions:
  contents: write         # Needed to commit results back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the pipeline
        run: python run_pipeline.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%F) automated update" && git push
